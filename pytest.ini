[pytest]
# Collect the real test suite under tests/ (incl. tests/chaos/).
# Previously this was pinned to `test_math_utils.py`, which silently disabled
# the entire suite and only ran a playground toy file.
testpaths = tests
python_files = test_*.py
addopts = -q
# Keep collection away from the embedded scratch project, which has its own
# (uninstalled) dependencies and breaks collection with ModuleNotFoundError.
norecursedirs = scratch .venv node_modules .git playground reference_prompts artifacts
markers =
    asyncio: mark a coroutine test to run on the asyncio event loop (pytest-asyncio).
    anyio: mark a coroutine test to run via the anyio plugin.
    timeout: per-test timeout in seconds (requires pytest-timeout if used).
